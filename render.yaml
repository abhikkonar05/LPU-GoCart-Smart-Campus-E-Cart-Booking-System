services:
  # 1. FastAPI Python Web Service
  - type: web
    name: lpu-gocart-api
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lpu-gocart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_MODE
        value: demo
      - key: FRONTEND_URL
        value: https://lpu-gocart.onrender.com
      - key: CORS_ORIGINS
        value: "https://lpu-gocart.onrender.com,http://localhost:5173"

  # 2. React Static Site
  - type: web
    name: lpu-gocart-web
    env: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lpu-gocart-api.onrender.com

databases:
  # 3. Render Free Managed PostgreSQL
  - name: lpu-gocart-db
    region: oregon
    plan: free
    databaseName: lpugocart
    user: gocart_user
